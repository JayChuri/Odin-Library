<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="library.css">
</head>

<body>
    <h1 id="heading">Library</h1>
    <div id="new-button">
        <button type="button" id="add-new-book">Add New Book</button>
    </div>
    <div id="form">
        
        <form id="book-form">
            <label for="title" id="form-label">Title</label>
            <input type="text" name="title" id="form-title" required>

            <label for="author" id="form-label">Author</label>
            <input type="text" name="author" id="form-author" required>

            <label for="pages" id="form-label">Pages</label>
            <input type="number" id="pages" name="pages" inputmode="numeric" required />

            <label for="is_read" id="form-label">Read</label>
            <input type="checkbox" name="is_read" id="form-checkbox">

            <button type="reset" id="reset-button">Reset</button>
            <button type="button" id="submit_button">Submit</button>
        </form>
    </div>

    <div id="cards">

    </div>
    <script src="library.js" defer></script>
</body>

</html>
